<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>데이타운감정평가사사무소</title>
  <meta name="description" content="데이터와 현장의 결합, AVM 기반 감정평가 및 자문 서비스를 제공합니다." />
  <meta name="robots" content="index, follow">
  
  <meta property="og:type" content="website">
  <meta property="og:title" content="데이타운감정평가사사무소">
  <meta property="og:description" content="AVM 기반 스마트한 감정평가 솔루션">
  <meta property="og:url" content="https://datawn.co.kr">
  <meta property="og:image" content="https://datawn.co.kr/og-image.png">

  <link rel="icon" href="favicon.png" type="image/x-icon">
  <link rel="shortcut icon" href="favicon.png" type="image/x-icon">
  
  <link rel="canonical" href="https://datawn.co.kr">
  <link rel="preload" as="image" href="main.webp">

  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <style>
    :root {
      --bg1: #0f1724; 
      --bg2: #071126;
      --accent: #38bdf8; 
      --kakao: #FEE500; 
      --kakao-text: #191919;
      --muted: #9ca3af; 
      --card: #0b1220;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    input, button, a, .brand, .action-card {
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      font-family: "Pretendard", Inter, "Noto Sans KR", sans-serif;
      color: #e6eef8;
      background: linear-gradient(180deg, var(--bg1), var(--bg2));
      word-break: keep-all;
      overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; transition: 0.3s; }
    .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }

    /* HEADER */
    header {
      position: fixed; top: 0; left: 0; width: 100%;
      background: rgba(10, 15, 25, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      z-index: 1000;
      height: 64px;
    }
    
    .nav {
      display: flex; align-items: center; justify-content: space-between;
      height: 100%;
      position: relative; /* 햄버거 버튼 위치 기준점 */
    }
    
    /* 로고 */
    a.brand { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .brand .logo { width: 40px; height: auto; border-radius: 8px; }
    .brand span { font-weight: 700; font-size: 15px; color: white; }

    /* 데스크탑 메뉴 */
    nav ul { list-style: none; display: flex; gap: 24px; margin: 0; padding: 0; }
    nav li { font-size: 14px; color: var(--muted); cursor: pointer; transition: color 0.2s; }
    nav li:hover { color: var(--accent); }

    /* 햄버거 버튼 (기본 숨김) */
    .mobile-menu-btn { 
        display: none; 
        background: none; 
        border: none; 
        color: white; 
        font-size: 26px; 
        cursor: pointer; 
        padding: 0;
    }

    /* HERO */
    .hero {
      min-height: 90vh;
      display: grid; align-items: center;
      position: relative; overflow: hidden;
      padding-top: 100px; padding-bottom: 60px;
      background-color: var(--bg1);
      background: linear-gradient(to bottom, rgba(15, 23, 36, 0.9) 0%, rgba(15, 23, 36, 0.0) 100%),
                  url("main.webp") center/cover no-repeat;
    }
    .hero-inner { display: flex; gap: 40px; align-items: center; flex-wrap: wrap; position: relative; z-index: 1; }
    .hero-left { flex: 1; min-width: 280px; }
    
    h1 { font-size: clamp(32px, 5vw, 48px); line-height: 1.2; margin: 0; color: white; font-weight: 800; }
    
    .slogan { 
      font-size: clamp(16px, 2vw, 20px); 
      color: var(--accent); 
      margin-top: 16px; 
      opacity: 0; 
      animation: fadeUp 1s ease 0.2s forwards; 
    }
    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } from { opacity: 0; transform: translateY(20px); } }

    .cta { margin-top: 32px; display: flex; gap: 12px; flex-wrap: wrap; }
    .btn { padding: 14px 24px; border-radius: 8px; border: 0; cursor: pointer; font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform 0.2s; }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: linear-gradient(90deg, var(--accent), #2563eb); color: white; box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3); animation: pulse 2s infinite; }
    .btn-kakao { background-color: var(--kakao); color: var(--kakao-text); box-shadow: 0 4px 15px rgba(254, 229, 0, 0.2); }
    .btn-kakao:hover { background-color: #E6CE00; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(56, 189, 248, 0); } 100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); } }

    /* CARD STYLE */
    .card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 24px; color: var(--muted); backdrop-filter: blur(5px); }

    .action-card {
        transition: all 0.3s ease;
        cursor: pointer;
        display: flex; flex-direction: column; justify-content: space-between; height: 100%;
    }
    .action-card:hover {
        transform: translateY(-8px);
        border-color: var(--accent) !important;
        background: rgba(255, 255, 255, 0.08) !important;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .action-card:active { transform: translateY(-2px) scale(0.98); transition: transform 0.1s; }
        
    .partner-label {
        font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 8px; display: block; text-align: right;
    }

    /* SECTIONS */
    section { padding-top: 180px; padding-bottom: 180px; }
    section h2 { 
        color: white; margin-top: 40px; margin-bottom: 60px; 
        font-size: 32px; font-weight: 700; 
        border-left: 5px solid var(--accent); padding-left: 20px; 
    }

    /* ABOUT */
    .about { display: flex; flex-wrap: wrap; gap: 30px; align-items: stretch; justify-content: center; }
    .about-text { flex: 1; min-width: 280px; }
    .about-text .card { padding: 24px; height: 100%; display: flex; flex-direction: column; justify-content: center; }
    .about-text h3 { margin-top: 0; font-size: 1.4rem; color: white; }
    .about-text p { margin-top: 12px; font-size: 0.95rem; line-height: 1.6; color: #e5e7eb; }
    .about-photo { flex: 0 0 240px; position: relative; }
    .about-photo img { width: 100%; height: 100%; border-radius: 16px; object-fit: cover; object-position: top; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    .career-list { margin-top: 16px; padding-left: 20px; line-height: 1.6; }
    .career-list li { color: #d1d5db; margin-bottom: 4px; font-size: 0.95rem; }

    /* SERVICES */
    .services { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
    .service { padding: 30px; border-radius: 16px; background: rgba(255, 255, 255, 0.02); transition: 0.3s; border: 1px solid transparent; }
    .service:hover { transform: translateY(-8px); background: rgba(255, 255, 255, 0.05); border-color: var(--accent); }
    .service h3 { margin: 0 0 12px 0; color: white; font-size: 20px; }
    .service p { margin: 0; font-size: 16px; line-height: 1.6; color: #9ca3af; }

    /* PROCESS */
    .steps { display: flex; gap: 30px; flex-wrap: wrap; }
    .step { flex: 1; min-width: 220px; padding: 30px; border-radius: 16px; background: rgba(255, 255, 255, 0.02); position: relative; }
    .step-number { background: var(--accent); color: #000; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; margin-bottom: 20px; font-size: 18px; }
    .step h4 { font-size: 1.2rem; margin-bottom: 10px; }

    /* CONTACT */
    .contact-container { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }

    footer { padding: 60px 0; color: rgba(255,255,255,0.4); font-size: 14px; text-align: center; border-top: 1px solid rgba(255, 255, 255, 0.05); margin-top: 80px; }

    /* ▼ [수정됨] 모바일 반응형 스타일 (여기가 핵심!) */
    @media(max-width: 768px) {
      section { padding-top: 100px; padding-bottom: 100px; }
      section h2 { margin-top: 20px; margin-bottom: 40px; }
      
      /* 1. 메뉴 버튼 보이게 설정 */
      .mobile-menu-btn { 
          display: block; 
          position: absolute; 
          right: 24px; /* 우측 고정 */
          top: 50%; 
          transform: translateY(-50%); 
      }

      /* 2. 네비게이션 메뉴 기본적으로 숨김 (unraveled 방지) */
      .nav ul { 
          display: none; /* 평소엔 안 보임 */
          flex-direction: column; 
          position: absolute; 
          top: 64px; 
          left: 0; 
          width: 100%; 
          background: var(--bg2); 
          padding: 20px; 
          border-bottom: 1px solid rgba(255,255,255,0.1); 
          box-shadow: 0 10px 20px rgba(0,0,0,0.5);
      }

      /* 3. 메뉴 활성화 시(active 클래스) 보이게 */
      .nav ul.active { display: flex; }

      /* 4. 메인 텍스트 중앙 정렬 */
      .hero-inner { flex-direction: column; text-align: center; justify-content: center; }
      .hero-left { width: 100%; display: flex; flex-direction: column; align-items: center; }
      
      /* 5. 버튼 크기 및 정렬 (가운데, 꽉 차게) */
      .cta { 
          flex-direction: column; 
          width: 100%; 
          max-width: 320px; 
          gap: 12px; 
      }
      .btn { width: 100%; justify-content: center; }

      .about { flex-direction: column; align-items: center; gap: 40px; }
      .contact-container { grid-template-columns: 1fr; }
      
      .about-photo { flex: 0 0 200px; width: 100%; max-width: 240px; }
      .about-photo img { height: auto; aspect-ratio: 3/4; }
    }

    /* MODAL */
    .modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); }
    .
